services:
  - type: web
    name: claws-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.0.0
    healthCheckPath: /
